name: Report a problem
description: Recording, insertion, setup, or interface problems
body:
  - type: markdown
    attributes:
      value: Please use a short example with non-private text. Do not upload recordings, passwords, keys, or personal transcripts.
  - type: input
    id: version
    attributes:
      label: Veylume and macOS versions
      placeholder: Veylume 0.1.0 (13), macOS …, M-series chip …
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Destination app and field
      description: If this concerns insertion, name the app and type of field.
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Short steps, what you expected, and what happened instead.
    validations:
      required: true
